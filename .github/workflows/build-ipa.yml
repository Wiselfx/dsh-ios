name: Build unsigned IPA

# Fork-only workflow: builds DSH.app without any code signing and packages it
# as an unsigned .ipa artifact. No Apple Developer account or secrets needed.
# Install the resulting ipa with TrollStore / AltStore / Sideloadly.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          uname -m
          node --version
          ruby --version

      - name: Install build dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install meson lld libarchive
          gem install xcodeproj --no-document

      - name: Cache guest rootfs
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: build/root.tar.gz
          key: rootfs-${{ runner.os }}-${{ hashFiles('rootfs/**', 'scripts/build-rootfs.sh') }}

      - name: Build iSH-ARM64 emulator (CLI + fakefsify)
        run: make emulator

      - name: Build guest rootfs (Alpine + Node 22 + dsh)
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: make rootfs

      - name: Build unsigned DSH.app
        run: |
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/dd/Build/Products/Release-iphoneos/DSH.app
          test -d "$APP" || { echo "DSH.app not found at $APP"; find build/dd -name 'DSH.app' -maxdepth 6; exit 1; }
          rm -rf Payload DSH-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DSH-unsigned.ipa Payload
          ls -lh DSH-unsigned.ipa
          du -sh "$APP"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: DSH-unsigned.ipa
          retention-days: 30
